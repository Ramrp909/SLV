name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Python version
  PYTHON_VERSION: "3.12"

  # Django settings
  DJANGO_SETTINGS_MODULE: "config.settings.dev"

  # CI-only made-up values (no real secrets)
  DJANGO_SECRET_KEY: "ci-secret-key-not-for-production-use-only-1234567890"
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

  # PostgreSQL (service container)
  POSTGRES_DB: "paint_shop_test"
  POSTGRES_USER: "paint_shop_test"
  POSTGRES_PASSWORD: "ci_test_password"
  POSTGRES_HOST: "localhost"
  POSTGRES_PORT: "5432"

  # JWT
  JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "15"
  JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"

  # CORS
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

jobs:
  test:
    name: Test (Python ${{ env.PYTHON_VERSION }}, PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint check
        working-directory: ./backend
        run: ruff check .

      - name: Run Ruff format check
        working-directory: ./backend
        run: ruff format --check .

      - name: Run Django system check
        working-directory: ./backend
        run: python manage.py check

      - name: Run pytest
        working-directory: ./backend
        run: python -m pytest -v