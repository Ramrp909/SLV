[project]
name = "paint-shop-backend"
version = "0.1.0"
description = "Paint Shop Management System Backend"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20"]
ignore = ["E501", "N802", "N803", "N806", "B008", "C901"]
per-file-ignores = { "tests/*" = ["S101"], "migrations/*" = ["E501", "N802", "N803", "N806"], "config/settings/*" = ["F403", "F405"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["*TestCase"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
testpaths = ["apps"]
filterwarnings = ["ignore::DeprecationWarning"]