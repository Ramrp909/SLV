[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = *TestCase
python_functions = test_*
addopts = -v --tb=short --strict-markers
testpaths = apps common backend/acceptance
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: pure logic tests that do not touch the database
    db: tests that need the database
    api: HTTP endpoint tests
    concurrency: tests using threads or locks; slow
    acceptance: cross-app gate tests
    slow: slow-running tests