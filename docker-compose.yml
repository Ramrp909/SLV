version: '3.8'

services:
  db:
    image: postgres:16
    container_name: paint-shop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paint_shop}
      POSTGRES_USER: ${POSTGRES_USER:-paint_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paint_shop} -d ${POSTGRES_DB:-paint_shop}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local